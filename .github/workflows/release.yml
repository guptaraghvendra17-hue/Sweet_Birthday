name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish GitHub Release with APK asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} Sweet_Birthday.apk \
            --title "Sweet Birthday ${{ github.ref_name }}" \
            --notes "🎀 **Sweet Birthday Standalone Android App (APK)**\n\nDownload the attached `Sweet_Birthday.apk` (5.90 MB) directly to your Android device."
